included:
  - Packages
  - App/Sources
excluded:
  - Packages/*/.build
  - App/Overreach.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_first_last
  - unused_import
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo            # TODOs are allowed during the prototype phases
  - trailing_comma  # trailing commas in multi-line literals keep diffs small

line_length:
  warning: 120
  error: 160

identifier_name:
  excluded: [id, kg, hr, rm, db]

type_body_length:
  warning: 300
file_length:
  warning: 500

# Views only render (ADR-0014). SwiftPM does not stop a target importing a transitive dependency, so the
# boundary is checked here.
custom_rules:
  haptics_through_helper:
    name: "Haptics through the helper"
    included: ".*/(Packages/OverreachKit/Sources|App/Sources)/.*\\.swift"
    excluded: ".*/DesignSystem/Haptics\\.swift"
    regex: "\\.sensoryFeedback\\s*\\("
    message: "Play haptics with .haptic(_:trigger:when:) so one setting can turn them off (ADR-0041)."
    severity: error
  no_analytics_in_ui:
    name: "No Analytics in UI"
    included: ".*/(Packages/OverreachKit/Sources/(Feature[^/]+|DesignSystem)/.*|App/Sources/RootView)\\.swift"
    regex: "^\\s*(@testable\\s+)?import\\s+Analytics\\b"
    message: "UI must not run rules: expose the result from the feature's presentation model (ADR-0014)."
    severity: error
  no_data_logic_in_views:
    name: "No data logic in views"
    included: ".*/(Packages/OverreachKit/Sources/Feature[^/]+/[^/]*View|App/Sources/RootView)\\.swift"
    regex: "\\.(filter|sorted)\\s*[({]"
    message: "Filter and sort in the presentation model, not in the view (ADR-0014)."
    severity: warning
