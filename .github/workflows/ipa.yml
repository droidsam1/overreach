name: Build IPA

# Builds an installable .ipa for sideloading without a Mac (docs/install-without-mac.md).
# The app is only ad-hoc signed here; Sideloadly or AltStore re-sign it with your own Apple ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Device build (.ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Archive (device, unsigned)
        run: |
          xcodebuild archive \
            -project App/Overreach.xcodeproj \
            -scheme Overreach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Overreach.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign with entitlements and package
        # Embedding the entitlements (HealthKit) in the signature lets sideloading tools carry them over
        # when they re-sign the app with your Apple ID.
        run: |
          APP=build/Overreach.xcarchive/Products/Applications/Overreach.app
          codesign --force --sign - --entitlements App/Overreach.entitlements "$APP"
          codesign --display --entitlements - "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          SHORT_SHA=$(git rev-parse --short HEAD)
          (cd build && zip -qry "Overreach-${SHORT_SHA}.ipa" Payload)
          ls -la build/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Overreach-ipa
          path: build/*.ipa
          retention-days: 14
