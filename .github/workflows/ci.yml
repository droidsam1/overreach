name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository rules and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository rules
        run: python3 scripts/check-repo.py
      - name: Test priority selection
        run: python3 scripts/test-priority-queue.py
      - name: Test agent tools
        run: python3 scripts/test-agent-tools.py
      - name: Check that no other PR claims this task
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-task-claim.py --ci
      - name: Check translations
        run: python3 scripts/check-localization.py

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test OverreachCore
        run: swift test --package-path Packages/OverreachCore

  apple:
    name: Kit tests, lint and app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # new lint warnings are found against the PR base
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        shell: bash  # pipefail: a SwiftLint error still fails the step
        run: swiftlint --reporter github-actions-logging | tee swiftlint.log
      - name: No new lint warnings on changed lines
        if: github.event_name == 'pull_request'
        run: python3 scripts/new-lint-warnings.py --base "origin/${{ github.base_ref }}" swiftlint.log
      - name: Test OverreachCore
        run: swift test --package-path Packages/OverreachCore
      - name: Test OverreachKit
        run: swift test --package-path Packages/OverreachKit
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild build \
            -project App/Overreach.xcodeproj \
            -derivedDataPath build \
            -scheme Overreach \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: UI tests (simulator)
        run: |
          xcodebuild test \
            -project App/Overreach.xcodeproj \
            -derivedDataPath build \
            -scheme Overreach \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
      - name: Check the app contains its languages
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Overreach.app
          test -d "$app/es.lproj" && test -d "$app/gl.lproj"
